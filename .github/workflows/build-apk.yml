name: build_apk

# Builds a sideloadable, self-signed release APK of this fork and attaches
# it to the run as a downloadable artifact. No repo secrets required —
# every dependency here (pub.dev packages + the 4 git submodules) is public.
#
# Run it from the Actions tab (workflow_dispatch), or it runs automatically
# on every push.

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Fetch pub packages
        run: flutter pub get

      # The project's own signingConfigs read android/key.properties and
      # fail the build if it's missing (even the debug config is wired to
      # it) — so generate a disposable self-signed keystore here. This
      # can't publish to the Play Store or update over a differently-signed
      # install, but it installs fine via sideload/ADB on your own device.
      - name: Generate a throwaway signing key
        run: |
          keytool -genkeypair -v \
            -keystore android/app/keystore.jks \
            -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias namidavinyl \
            -storepass namidavinyl \
            -keypass namidavinyl \
            -dname "CN=Namida Vinyl Fork, OU=Personal Build, O=Personal, L=, S=, C=US"
          cat > android/key.properties <<'EOF'
          storePassword=namidavinyl
          keyPassword=namidavinyl
          keyAlias=namidavinyl
          storeFile=keystore.jks
          EOF

      - name: Build APKs (arm64 + armeabi-v7a)
        run: |
          flutter build apk --target-platform android-arm64 --release
          flutter build apk --target-platform android-arm --release

      - name: Collect APKs
        run: |
          mkdir -p build_final
          cp build/app/outputs/flutter-apk/*.apk build_final/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: namida-vinyl-apk
          path: build_final/*.apk
          retention-days: 14
